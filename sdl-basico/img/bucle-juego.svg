<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Bucle de juego de SDL: leer eventos, actualizar y dibujar</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="700" height="320" rx="10" fill="#f8fafc"/>

  <rect x="20" y="20" width="190" height="58" rx="8" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="115" y="42" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Inicio</text>
  <text x="115" y="63" text-anchor="middle" font-size="13" fill="#1f2937" font-family="Menlo, Consolas, monospace">SDL_Init(...)</text>

  <rect x="255" y="20" width="190" height="58" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="350" y="42" text-anchor="middle" font-size="15" font-weight="600" fill="#7f1d1d">Fin</text>
  <text x="350" y="63" text-anchor="middle" font-size="13" fill="#7f1d1d" font-family="Menlo, Consolas, monospace">SDL_Quit()</text>

  <rect x="20" y="120" width="190" height="100" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="115" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">1. Leer eventos</text>
  <text x="115" y="172" text-anchor="middle" font-size="13" fill="#1e3a8a" font-family="Menlo, Consolas, monospace">SDL_PollEvent(&amp;e)</text>
  <text x="115" y="194" text-anchor="middle" font-size="13" fill="#1e3a8a">teclas, ratón, cerrar</text>

  <rect x="255" y="120" width="190" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="350" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#78350f">2. Actualizar</text>
  <text x="350" y="172" text-anchor="middle" font-size="13" fill="#78350f" font-family="Menlo, Consolas, monospace">jugador.x += PASO</text>
  <text x="350" y="194" text-anchor="middle" font-size="13" fill="#78350f" font-family="Menlo, Consolas, monospace">SDL_HasIntersection</text>

  <rect x="490" y="120" width="190" height="100" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="585" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">3. Dibujar</text>
  <g text-anchor="middle" font-size="13" fill="#14532d" font-family="Menlo, Consolas, monospace">
    <text x="585" y="168">SDL_RenderClear</text>
    <text x="585" y="187">SDL_RenderFillRect</text>
    <text x="585" y="206">SDL_RenderPresent</text>
  </g>

  <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="115" y1="80" x2="115" y2="116"/>
    <line x1="212" y1="170" x2="251" y2="170"/>
    <line x1="447" y1="170" x2="486" y2="170"/>
    <path d="M585 222 V270 H115 V224"/>
  </g>
  <path d="M180 118 L262 82" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>
  <text x="228" y="108" font-size="13" fill="#b91c1c" font-family="Menlo, Consolas, monospace">SDL_QUIT</text>
  <text x="350" y="292" text-anchor="middle" font-size="13" fill="#111827">siguiente fotograma: el bucle se repite unas 60 veces por segundo</text>
</svg>
