<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Marco de pila de _main en ARM64 tras el prólogo</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="620" height="400" rx="10" fill="#f8fafc"/>
  <text x="20" y="30" font-size="15" font-weight="600" fill="#111827">Marco de pila de _main tras el prólogo (48 bytes)</text>

  <g font-size="13" font-family="Menlo, Consolas, monospace" fill="#374151" text-anchor="end">
    <text x="190" y="82">sp+40</text>
    <text x="190" y="126">sp+32</text>
    <text x="190" y="170">sp+24</text>
    <text x="190" y="214">sp+16</text>
    <text x="190" y="258">sp+8</text>
    <text x="190" y="302">sp+0</text>
  </g>

  <g stroke-width="1.5">
    <rect x="200" y="60" width="240" height="44" fill="#fef3c7" stroke="#f59e0b"/>
    <rect x="200" y="104" width="240" height="44" fill="#fef3c7" stroke="#f59e0b"/>
    <rect x="200" y="148" width="240" height="44" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="200" y="192" width="240" height="44" fill="#f3f4f6" stroke="#9ca3af"/>
    <rect x="200" y="236" width="240" height="44" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="200" y="280" width="240" height="44" fill="#dbeafe" stroke="#3b82f6"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="320" y="87" fill="#78350f">x30: dirección de retorno</text>
    <text x="320" y="131" fill="#78350f">x29 del llamador</text>
    <text x="320" y="175" fill="#14532d">n en [x29−4] (4 bytes)</text>
    <text x="320" y="219" fill="#4b5563">libre</text>
    <text x="320" y="263" fill="#1e3a8a">2º argumento variádico</text>
    <text x="320" y="298" fill="#1e3a8a">1er argumento variádico</text>
    <text x="320" y="316" fill="#1e3a8a">(&amp;n para scanf)</text>
  </g>

  <g font-size="13" fill="#111827">
    <text x="452" y="87" fill="#78350f">(guardado por stp)</text>
    <text x="452" y="131">← x29 apunta aquí</text>
    <text x="452" y="307">← sp apunta aquí</text>
  </g>

  <g font-size="13" fill="#374151">
    <text x="20" y="72">direcciones</text>
    <text x="20" y="90">altas</text>
    <text x="20" y="300">direcciones</text>
    <text x="20" y="318">bajas</text>
  </g>
  <line x1="60" y1="104" x2="60" y2="276" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text x="72" y="196" font-size="13" fill="#374151">crece</text>

  <text x="20" y="360" font-size="13" fill="#111827"><tspan font-family="Menlo, Consolas, monospace">sub sp, sp, #48</tspan> reserva el marco: la pila crece hacia direcciones bajas.</text>
  <text x="20" y="382" font-size="13" fill="#111827"><tspan font-family="Menlo, Consolas, monospace">ldp</tspan> recupera x29 y x30 antes de <tspan font-family="Menlo, Consolas, monospace">ret</tspan>.</text>
</svg>
